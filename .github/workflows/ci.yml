name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Fast lane:纯 Rust 内核逻辑,ubuntu 起 runner 更快,几秒就能 fail。
  # 守住「内核 bug 不被 AppKit 编译拖慢」的反馈速度。
  core-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (core)
        run: cargo clippy -p agent-light-core --all-targets -- -D warnings

      - name: test (core)
        run: cargo test -p agent-light-core

  # Cross-compile smoke test:守住 DEV.md「内核零 AppKit、可移植」的设计原则。
  # 一旦有人在 crates/core 误引 objc2 / cocoa,跨平台 cargo check 立刻 fail。
  core-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable) + cross target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # aarch64 交叉编译需要对应的 C 工具链（rusqlite bundled → libsqlite3-sys 编译 C）。
      # ubuntu-latest 只自带 x86_64 gcc；aarch64 需额外安装。
      - name: Install aarch64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: check (core, ${{ matrix.target }})
        run: cargo check -p agent-light-core --target ${{ matrix.target }}

  check:
    # app 壳依赖 objc2/AppKit,只能在 macOS 上编译/测试。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable) + rustfmt + clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # 端到端:把 make-app.sh 跑一遍,把可双击运行的 .app 上传成 artifact。
      # reviewer 在 PR 页面直接下载 Asig.app 即可实测,不再依赖本地重编。
      - name: Package .app
        run: ./scripts/make-app.sh

      - name: Upload Asig.app
        uses: actions/upload-artifact@v7
        with:
          name: Asig-app
          path: build/Asig.app
          if-no-files-found: error
          retention-days: 14

  # 供应链检查:许可证白名单 + RustSec 漏洞 + 禁用/重复版本/来源。
  # cargo-deny 的 advisories 检查与 cargo-audit 同源(都读 RustSec 库),已覆盖其职责,
  # 故不再单独跑 cargo-audit。只需读 Cargo.lock,放 ubuntu 上与 macos 并行,更快。
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # 依赖卫生:cargo-machete 查未用依赖(fail)、cargo-outdated 查过时依赖(advisory,不 fail)。
  # 放 ubuntu 并行,不阻主干反馈。taiki-e/install-action 装预编译二进制,省 cargo install 编译。
  deps-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete,cargo-outdated
      - name: Unused dependencies (machete)
        run: cargo machete
      - name: Outdated dependencies (advisory)
        run: cargo outdated --workspace || true

  # 文档格式:mdformat 按 .mdformat.toml 检查 git 跟踪的 Markdown。
  # 版本须与 pyproject.toml dev 组的 pin 一致(formatter 输出随版本漂移,不能浮动);
  # 大版本升级若风格漂移,需两边同步改 + 一次性重排。
  docs-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install mdformat (pinned)
        run: pip install mdformat==1.0.0 mdformat-gfm==1.0.0

      - name: mdformat --check (tracked .md)
        run: git ls-files '*.md' | xargs mdformat --check

  # Python 脚本质量:ruff 官方 action(astral-sh/ruff-action),规则走 ruff 默认
  # (pyproject 无 [tool.ruff] 段)。check 用 --output-format=github 在 PR 上内联标注;
  # format --check 守默认 88 行宽。版本与 pyproject dev 组 pin 一致(lint 结果随版本漂移)。
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/ruff-action@v4
        with:
          version: 0.16.6
          args: check --output-format=github .

      - uses: astral-sh/ruff-action@v4
        with:
          version: 0.16.6
          args: format --check .
